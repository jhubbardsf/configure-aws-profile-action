# action.yaml
name: Configure AWS Profile
description: Configures an OIDC AWS Role Session as an AWS config profile.

branding:
  icon: cloud
  color: orange

inputs:
  role-arn:
    required: true
    description: ARN of the role to assume.
  profile-name:
    required: true
    description: 'Name of profile to be created. Allowed: letters, numbers, ., _, -'
  region:
    required: false
    description: AWS region to use.
    default: us-west-2

runs:
  using: composite
  steps:
    - name: Preflight validation
      shell: bash
      run: |
        set -euo pipefail
        PROFILE_NAME="${{ inputs.profile-name }}"
        if ! [[ "$PROFILE_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Invalid profile-name: $PROFILE_NAME. Allowed characters: letters, numbers, ., _, -"
          exit 1
        fi
        if [ -z "${{ inputs.role-arn }}" ]; then
          echo "role-arn is required"
          exit 1
        fi
        # Validate ARN format
        if ! [[ "${{ inputs.role-arn }}" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
          echo "Invalid role-arn format. Expected: arn:aws:iam::<account-id>:role/<role-name>"
          exit 1
        fi

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
        mask-aws-account-id: 'yes'

    - name: Setup Profile
      shell: bash
      run: |
        set -euo pipefail
        aws configure set region "${{ inputs.region }}" --profile "${{ inputs.profile-name }}"
        aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID}" --profile "${{ inputs.profile-name }}"
        aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY}" --profile "${{ inputs.profile-name }}"
        aws configure set aws_session_token "${AWS_SESSION_TOKEN}" --profile "${{ inputs.profile-name }}"

    - name: Reset AWS Environment Variables
      shell: bash
      run: |
        set -euo pipefail
        echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
        echo "AWS_SESSION_TOKEN=" >> "$GITHUB_ENV"
        echo "AWS_REGION=" >> "$GITHUB_ENV"
        echo "AWS_DEFAULT_REGION=" >> "$GITHUB_ENV"

    - name: Check Profile
      shell: bash
      run: |
        set -euo pipefail
        aws sts get-caller-identity --profile "${{ inputs.profile-name }}"
